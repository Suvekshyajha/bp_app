name: CI

# When to run: on every pull request, and on every push to dev or main.
on:
  pull_request:
  push:
    branches: [dev, main]

# Cancel an older run of the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only access to the repository (safest default).
permissions:
  contents: read

jobs:
  # The "name:" of each job is what you select later in branch protection.
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Vite 8, Vitest 5 and ESLint 10 need a recent Node, so use 22.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installs exactly what package-lock.json says (the lock file must be committed).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (also type-checks with tsc)
        run: npm run build

  # One job definition, run twice: once per service.
  backend:
    name: Backend ${{ matrix.service }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      # If one service fails, still let the other finish so you see both results.
      fail-fast: false
      matrix:
        service: [orchestrator, retriever]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # llm.py raises an error at import time without GROQ_API_KEY, so give
      # the tests a dummy value. No real key is needed or used.
      # "python -m pytest" adds the service folder to the import path.
      - name: Test
        env:
          GROQ_API_KEY: dummy-key-for-tests
        run: python -m pytest tests