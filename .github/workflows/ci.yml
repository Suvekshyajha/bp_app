# Where this file goes: <repo root>/.github/workflows/ci.yml
# (the root of the repository, NOT inside any service folder)

name: CI

# When to run: on every pull request, and on every push to dev or main.
on:
  pull_request:
  push:
    branches: [dev, main]

# Cancel an older run of the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only access to the repository (safest default).
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Vite 8, Vitest 5 and ESLint 10 need a recent Node, so use 22.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (also type-checks with tsc)
        run: npm run build

  # NEW: the shared "common" package (crypto, sanitize, service_auth, logging,
  # lazy embeddings). It has no requirements file, so its few dependencies
  # are listed here. Torch / fastembed are NOT needed (a test checks that
  # importing common.embeddings does not load them).
  common:
    name: Shared common (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/shared_common
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/shared_common/pyproject.toml

      - name: Install dependencies
        run: |
          pip install pytest cryptography python-dotenv sqlalchemy
          pip install -e .

      - name: Test
        run: python -m pytest

  # One job definition, run three times: once per service.
  backend:
    name: Backend ${{ matrix.service }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      # If one service fails, still let the others finish so you see all results.
      fail-fast: false
      matrix:
        service: [orchestrator, retriever, ingestion]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/${{ matrix.service }}/requirements.txt
            backend/${{ matrix.service }}/requirements-dev.txt

      # Keep the downloaded embedding model between runs. Only the retriever
      # uses a model. Change "v1" in the key to force a fresh download.
      - name: Cache Hugging Face models
        if: matrix.service == 'retriever'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-retriever-v1

      # NEW: every service does "from common...", and common is not on PyPI,
      # so install it from the repo first (same as "pip install -e backend/shared_common"
      # locally). Must run before the requirements install.
      - name: Install shared common package
        run: pip install -e ../shared_common

      # requirements-dev.txt pulls in requirements.txt and adds the test tools.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # chat_pb2.py and chat_pb2_grpc.py are generated from backend/proto/chat.proto
      # and are not stored in Git. Only the orchestrator and retriever use gRPC;
      # ingestion is plain HTTP, so it skips this step.
      # This step runs from the repository root, not from the service folder.
      - name: Generate gRPC code
        if: matrix.service != 'ingestion'
        working-directory: ${{ github.workspace }}
        run: >
          python -m grpc_tools.protoc
          -I backend/proto
          --python_out=backend/${{ matrix.service }}
          --grpc_python_out=backend/${{ matrix.service }}
          backend/proto/chat.proto

      # Dummy values only; no real key is needed or used. The ingestion tests
      # set their own test token and temp database in tests/conftest.py.
      # "python -m pytest" adds the service folder to the import path.
      # The service's pytest.ini already sets testpaths = tests.
      - name: Test
        env:
          GROQ_API_KEY: dummy-key-for-tests
        run: python -m pytest